<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workspace health</title>
    <script type="application/json" id="slideless-data">{}</script>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --ok: #2f9e6b;
        --fixed: #2a7fd4;
        --attention: #d39a1f;
        --failed: #d14646;
        --line: rgba(128, 128, 128, 0.25);
        font-family: 'Geist Sans', -apple-system, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #ededed; --muted: #9a9a9a; }
      }
      body { margin: 0; padding: 20px 22px; color: var(--ink); background: transparent; }
      h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; line-height: 1.3; }
      .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
      .status { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .status.ok { background: var(--ok); } .status.attention { background: var(--attention); } .status.failed { background: var(--failed); }
      .check { border-top: 1px solid var(--line); padding: 10px 0; }
      .check h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
      .verdict { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
      .verdict.ok { color: var(--ok); } .verdict.fixed { color: var(--fixed); } .verdict.attention { color: var(--attention); } .verdict.failed { color: var(--failed); }
      .check p { margin: 2px 0; font-size: 12px; color: var(--muted); }
      .check ul { margin: 4px 0 0; padding-left: 18px; font-size: 12px; }
      .list-title { font-size: 11px; color: var(--muted); margin-top: 6px; }
      .summary { font-size: 12px; white-space: pre-wrap; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 6px; }
      .empty { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1 id="headline">Workspace health</h1>
    <div class="meta" id="meta"></div>
    <div id="checks"></div>
    <div class="summary" id="summary"></div>
    <script>
      // The data Clave filled in: the run's envelope (`run`, `routine`) and the agent's `data`.
      const doc = JSON.parse(document.getElementById('slideless-data').textContent || '{}')
      const run = doc.run || {}
      const data = doc.data || {}
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      const when = (t) => (t ? new Date(t).toLocaleString() : '')
      document.getElementById('headline').innerHTML =
        `<span class="status ${esc(run.status || '')}"></span>${esc(run.headline || 'No report yet')}`
      document.getElementById('meta').textContent = run.reportedAt
        ? `${when(run.reportedAt)} · ${run.trigger || ''}`
        : 'This deck has no report yet.'
      const checks = Array.isArray(data.checks) ? data.checks : []
      document.getElementById('checks').innerHTML = checks.length
        ? checks
            .map(
              (c) => `<section class="check">
        <h2>${esc(c.name)} <span class="verdict ${esc(c.verdict)}">${esc(c.verdict)}</span></h2>
        ${c.detail ? `<p>${esc(c.detail)}</p>` : ''}
        ${c.fixed && c.fixed.length ? `<div class="list-title">Fixed</div><ul>${c.fixed.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${c.proposed && c.proposed.length ? `<div class="list-title">Proposed</div><ul>${c.proposed.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
      </section>`
            )
            .join('')
        : '<p class="empty">No checks were reported.</p>'
      document.getElementById('summary').textContent = run.summary || ''
    </script>
  </body>
</html>
