# The JVM Gradle runs on (JAVA_HOME = Homebrew's openjdk@21). No toolchain download, ever.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.java.installations.auto-download=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# The Kotlin Gradle plugin is applied explicitly at its pinned version (2.4.21), so AGP's
# built-in Kotlin (2.2.10, embedded in AGP 9.3.1) is off and the Kotlin version is ours to
# pin. The external plugin needs AGP's legacy DSL (the 9.0 "new DSL" refuses it); both
# options are deprecated for AGP 10, where the move to built-in Kotlin is owed.
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# Never let AGP install anything into the SDK: the SDK root is a private, pinned copy.
android.builder.sdkDownload=false
