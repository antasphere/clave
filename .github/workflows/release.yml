name: Release

# Every push to prod cuts a release. The bump level is the HIGHEST marker
# OPENING a commit SUBJECT in the range being released — the last v* tag to the
# head, "[major]" beating "[minor]" beating patch — or the explicit input when
# triggered manually (Actions → Release → Run workflow). The version-bump commit
# CI pushes back carries [skip ci], and GITHUB_TOKEN pushes never retrigger
# workflows, so there is no recursion.
#
# It reads the RANGE, never just the head, and that is load-bearing. CI bumps
# the version on prod, so prod always drifts one commit ahead of dev; every
# promotion therefore needs a back-merge of prod into dev; and that merge commit
# then becomes the head. A head-only read (`git log -1`) saw the merge's own
# message, never the work's, so a feature promoted through the normal flow
# always cut a patch — the marker was destroyed by the very step the design
# forces you to take. Reading the range makes the marker survive back-merges,
# squash-merges and the bump commit alike, and it needs no discipline from
# whoever is promoting.
#
# The macOS job owns the version, the tag and the GitHub Release; the Windows
# job (build-win.yml) then attaches its installer to that same release.
#
# A push to `beta` cuts a PRE-RELEASE instead (scripts/release.sh --prerelease):
# a signed, notarized build versioned `X.Y.Z-beta.N`, published as a GitHub
# pre-release on the pushed sha, with no bump commit and no push back. Only an
# install with "Receive pre-release builds" on ever sees it: a stable install
# reads /releases/latest, which excludes pre-releases. The Windows job does not
# run for a beta — build-win.yml reads its version from package.json, which a
# beta never bumps, and would mislabel the installer. Every step of the prod
# path is unchanged; the beta steps are the ones gated on `prerelease`.
on:
  push:
    branches: [prod, beta]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write

# Never run two releases at once; queue instead of cancelling a signing build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      # Only a push to `beta` is a pre-release; a manual run is a stable
      # release from prod, exactly as before.
      - name: Release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "beta" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Channel: beta (pre-release)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Channel: stable"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name == 'beta' && 'beta' || 'prod' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prod is protected by the "prod is release-only" ruleset (repo admins +
      # deploy key bypass). GITHUB_TOKEN cannot push there, so the version-bump
      # commit goes over SSH with the release deploy key. Push-only: fetches
      # keep using the checkout token.
      - name: Configure push access (release deploy key)
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes"
          git remote set-url --push origin git@github.com:antasphere/clave.git

      - name: Determine bump level
        id: bump
        if: steps.channel.outputs.prerelease != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${{ inputs.bump }}"
            echo "Bump level: $bump (manual input)"
          else
            # The commits being released: everything since the last release tag.
            # No tag yet (a first release) = the whole history, which is the
            # honest reading of "what is being released" at that point.
            last_tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
            if [ -n "$last_tag" ]; then
              range="${last_tag}..HEAD"
            else
              range="HEAD"
            fi
            # SUBJECTS only (%s), and the marker must OPEN the subject. A body
            # scan matches prose about markers — the commit that introduced
            # this very step says "[major] over [minor]" while explaining the
            # precedence, and a substring read of it computed `major`. The
            # marker is a subject-line convention ("[minor] A group view
            # starts…"), so read it exactly where it is written.
            subjects=$(git log --pretty=%s "$range")
            if printf '%s\n' "$subjects" | grep -qE '^\[major\]'; then
              bump=major
            elif printf '%s\n' "$subjects" | grep -qE '^\[minor\]'; then
              bump=minor
            else
              bump=patch
            fi
            echo "Bump level: $bump (highest marker in ${last_tag:-the full history}..HEAD)"
            echo "Commits considered:"
            git log --pretty='  %h %s' "$range"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, and publish
        if: steps.channel.outputs.prerelease != 'true'
        run: bash scripts/release.sh --${{ steps.bump.outputs.bump }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The beta path: the version is computed from the tags and the markers
      # (scripts/prerelease-version.mjs), nothing is committed or pushed, and
      # `gh release create --prerelease --target <sha>` creates the tag.
      - name: Build, sign, notarize, and publish pre-release
        if: steps.channel.outputs.prerelease == 'true'
        run: bash scripts/release.sh --prerelease
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Published tag
        id: tag
        if: steps.channel.outputs.prerelease != 'true'
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: release
    # macOS only for pre-releases (see the header).
    if: needs.release.outputs.prerelease != 'true'
    uses: ./.github/workflows/build-win.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
