name: Release

# Every push to prod cuts a release. The bump level comes from the head commit
# message — "[major]" or "[minor]" anywhere in it, defaulting to patch — or
# from the explicit input when triggered manually (Actions → Release →
# Run workflow). The version-bump commit CI pushes back carries [skip ci], and
# GITHUB_TOKEN pushes never retrigger workflows, so there is no recursion.
#
# The macOS job owns the version, the tag and the GitHub Release; the Windows
# job (build-win.yml) then attaches its installer to that same release.
on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write

# Never run two releases at once; queue instead of cancelling a signing build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prod is protected by the "prod is release-only" ruleset (repo admins +
      # deploy key bypass). GITHUB_TOKEN cannot push there, so the version-bump
      # commit goes over SSH with the release deploy key. Push-only: fetches
      # keep using the checkout token.
      - name: Configure push access (release deploy key)
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes"
          git remote set-url --push origin git@github.com:antasphere/clave.git

      - name: Determine bump level
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${{ inputs.bump }}"
          else
            msg=$(git log -1 --pretty=%B)
            case "$msg" in
              *"[major]"*) bump=major ;;
              *"[minor]"*) bump=minor ;;
              *)           bump=patch ;;
            esac
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump level: $bump"

      - name: Build, sign, notarize, and publish
        run: bash scripts/release.sh --${{ steps.bump.outputs.bump }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Published tag
        id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: release
    uses: ./.github/workflows/build-win.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
