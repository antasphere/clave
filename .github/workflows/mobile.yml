name: Mobile

# The native phone apps (the native mobile wave of 9 November 2026) and what
# they share. Four jobs:
#
#  - `apps`, on Linux: which app entries this checkout holds. An app's job
#    runs only when its entry is there, and shows as SKIPPED otherwise, with a
#    notice on the checks page, so a green app check is never a pass on an
#    absent app.
#  - `shared`, on Linux: the fixture vectors, the generated assets and the
#    fixture server of packages/mobile-native, which need no Mac: the vectors
#    and assets tests hold the committed files to the contract and to the
#    desktop's sources, and the fixture test boots this checkout's server as a
#    daemon with the Echo adapter, a local relay and the local OpenID Connect
#    provider, then runs the pairing proof against them.
#  - `ios`, on macos-26: the iOS app's own entry. Its core package's Swift
#    tests run on Xcode 26.0.1 (build 17A400), pinned through DEVELOPER_DIR;
#    the app is built and tested with Xcode 26.2 (build 17C52), named by
#    CLAVE_IOS_SIMULATOR_DEVELOPER_DIR: the image has no iOS 26.0 runtime,
#    which Xcode 26.0.1 needs to build the app, and 26.2's is installed.
#  - `android`, on Linux with Temurin JDK 21 and Gradle's cache: the Android
#    app's own entry; the SDK platform and build tools the app pins are what
#    its entry installs into the runner's ANDROID_HOME through sdkmanager.
#
# The entry of a native app is ONE executable file at the root of its folder,
# `apps/mobile-ios/ci.sh` and `apps/mobile-android/ci.sh`, owned by the app
# (lane A and lane B of the wave): the workflow runs `bash apps/mobile-<platform>/ci.sh`
# from the repository root with the toolchain environment set (DEVELOPER_DIR
# and CLAVE_IOS_SIMULATOR_DEVELOPER_DIR on the Mac; JAVA_HOME and ANDROID_HOME
# on Linux, sdkmanager on the PATH),
# and the script's exit code is the verdict. The script builds and tests the
# app and prints its counts; nothing here names a scheme, a module or a test
# target, so a rename inside an app is no edit here. While an app folder is
# absent, or holds no ci.sh, its job is skipped and a notice says so: the
# workflow landed before the apps did, and nothing in it needs them to exist.
# The structure guard refuses an app folder that holds files and no regular
# ci.sh, so an app that is there always runs.
on:
  push:
    branches: [mobile, dev]
    paths:
      - 'apps/mobile-ios/**'
      - 'apps/mobile-android/**'
      - 'packages/mobile-native/**'
      - 'packages/contract/**'
      - 'packages/server/**'
      - 'packages/host/**'
      - 'apps/server/**'
      - 'apps/relay/**'
      - 'packages/ui/src/tokens.css'
      - 'tests/e2e/fixtures/oidc-provider.mjs'
      - 'scripts/server-process.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile-ios/**'
      - 'apps/mobile-android/**'
      - 'packages/mobile-native/**'
      - 'packages/contract/**'
      - 'packages/server/**'
      - 'packages/host/**'
      - 'apps/server/**'
      - 'apps/relay/**'
      - 'packages/ui/src/tokens.css'
      - 'tests/e2e/fixtures/oidc-provider.mjs'
      - 'scripts/server-process.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Which native apps are here
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.find.outputs.ios }}
      android: ${{ steps.find.outputs.android }}
    steps:
      - uses: actions/checkout@v4

      - name: Find each app's entry
        id: find
        run: |
          for app in ios android; do
            if [ -f "apps/mobile-$app/ci.sh" ]; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
              echo "apps/mobile-$app/ci.sh is here: its job runs." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=No $app app yet::apps/mobile-$app/ci.sh is absent: its job is skipped, nothing is built or tested."
              echo "apps/mobile-$app/ci.sh is absent: its job is skipped, nothing is built or tested." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  shared:
    name: Vectors, assets and the fixture server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The fixture server runs this checkout's server entry and the relay
      # under Bun, the repository's own (the `bun` dev dependency, 1.4.1); the
      # exporter of the vectors runs under it too. The action pins the same
      # version for anything else that calls `bun`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'

      # One install from the root; its postinstall rebuilds node-pty for the
      # desktop, as checks.yml does.
      - name: Install dependencies
        run: npm ci

      - name: Structure
        run: npm run check:structure

      - name: The vectors are what the contract exports today
        run: npm run vectors:check --workspace @clave/mobile-native

      - name: The assets are what the desktop's sources generate today
        run: npm run assets:check --workspace @clave/mobile-native

      # The tests of the package: the vectors decoded once more through
      # their schemas, the assets held to their sources, and the fixture server
      # booted on free ports with the pairing proof run against it.
      # CLAVE_FIXTURE_BOOT=1 opts in to the booted cases
      # (fixture-server.boot.test.mjs), which never run without it.
      - name: Vectors, assets and fixture tests
        env:
          CLAVE_FIXTURE_BOOT: '1'
        run: npx vitest run packages/mobile-native

      - name: Lint and typecheck of the package
        run: npx eslint packages/mobile-native && npm run typecheck:node

  ios:
    name: iOS app (core on Xcode 26.0.1, app built and tested on Xcode 26.2, macOS 26)
    needs: apps
    if: needs.apps.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # The runner image carries several Xcode releases; the core package's
      # Swift tests run on the one the team runs (Xcode 26.0.1, Swift 6.2), by
      # its path.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      # Every xcodebuild step of the entry (the app's builds, its tests on a
      # simulator, the release build) runs with Xcode 26.2, by its path: the
      # image carries the iOS 26.2, 26.4.1 and 26.5 runtimes and no 26.0 one,
      # which Xcode 26.0.1 needs for a simulator and for its asset compiler.
      # Nothing is installed and nothing falls back to another Xcode.
      CLAVE_IOS_SIMULATOR_DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: The toolchain
        run: |
          xcodebuild -version
          swift --version
          DEVELOPER_DIR="$CLAVE_IOS_SIMULATOR_DEVELOPER_DIR" xcodebuild -version

      - name: Build and test the app through its own entry
        run: bash apps/mobile-ios/ci.sh

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/mobile-ios/**/*.xcresult
            apps/mobile-ios/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android app (JDK 21, Linux)
    needs: apps
    if: needs.apps.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # ANDROID_HOME is the runner's SDK root; the app's entry installs the
      # platform and the build tools it pins into it through sdkmanager, which
      # is on the PATH here.
      - name: Build and test the app through its own entry
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          java -version
          bash apps/mobile-android/ci.sh

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/mobile-android/**/build/reports/**
            apps/mobile-android/**/build/test-results/**
            apps/mobile-android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
