name: Build Windows Installer

# Two ways in. The release workflow calls this job after the macOS release has
# published the GitHub Release, passing the tag: the installer and its updater
# feed (latest.yml) are attached to that release. Run by hand with a tag, it does
# the same against an existing release; run by hand without one, it builds the
# selected ref and only keeps the artifact — the way to try a branch on Windows.
#
# Never trigger this on `release: published`: our releases are created with
# GITHUB_TOKEN, and events raised by that token start no workflows. A trigger on
# the release event ran for nothing from v1.65 on and nobody noticed.
#
# Not called for a pre-release (a push to `beta`): the version below comes from
# package.json, which a beta never bumps, so the installer would carry the last
# stable's number. Betas are macOS-only until this reads the tag's version.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the installer to (e.g. v1.89.0)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach to (leave empty to only keep the artifact)
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # postinstall skips the native rebuild on Windows (see scripts/postinstall.cjs).
      - name: Install dependencies
        run: npm ci

      # Synonym (Appearance → Font) may ship inside the app but not sit in this
      # public repository, so it arrives as a secret and is written into the
      # git-ignored folder scripts/copy-private-fonts.mjs fills on a local build.
      # Without the secret (a fork) the build simply offers Geist only.
      - name: Private fonts
        env:
          SYNONYM_WOFF2_B64: ${{ secrets.SYNONYM_WOFF2_B64 }}
        shell: bash
        run: |
          if [ -z "$SYNONYM_WOFF2_B64" ]; then
            echo "::warning::SYNONYM_WOFF2_B64 is not set: this build offers Geist only"
            exit 0
          fi
          mkdir -p src/renderer/src/assets/fonts/private
          printf '%s' "$SYNONYM_WOFF2_B64" | base64 --decode > src/renderer/src/assets/fonts/private/Synonym-Variable.woff2
          ls -l src/renderer/src/assets/fonts/private

      - name: Build and package (unsigned NSIS installer, x64)
        run: npm run build:win -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clave-windows-installer
          path: |
            dist/*setup.exe
            dist/*setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      # latest.yml is the electron-updater feed for Windows, the counterpart of
      # latest-mac.yml. Without it a Windows install never sees an update.
      - name: Attach to release
        if: inputs.tag != ''
        shell: bash
        run: gh release upload "${{ inputs.tag }}" dist/*setup.exe dist/*setup.exe.blockmap dist/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
