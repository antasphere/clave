name: CI1107 minimal tmux diagnosis
on:
  push:
    branches: [test/ci1107-r13-diagnostic]
permissions:
  contents: read
jobs:
  diagnostic:
    name: Diagnose (${{ matrix.case }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [state_minimal, tmux_clean_minimal]
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e85fac6707eb3843f7f933ee62e32b15a8ad7c3c
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install tmux
        run: brew install tmux
      - name: Install dependencies
        run: npm ci
      - name: Download Electron
        run: npx install-electron
      - name: Build native helpers
        run: npm run native:build
      - name: Build the app
        run: npx electron-vite build
      - name: Diagnose retained state
        env:
          DIAG_CASE: ${{ matrix.case }}
        run: |
          python3 - <<'PYDIAG'
          """Instrumented e85 diagnostics, never acceptance or timing evidence."""
          import ast
          import hashlib
          import json
          import os
          import subprocess
          import uuid
          from pathlib import Path

          HEAD = "e85fac6707eb3843f7f933ee62e32b15a8ad7c3c"
          case = os.environ["DIAG_CASE"]
          assert case in {"state_full", "state_first", "state_last", "cleanup", "tmux_per_spec", "state_minimal", "tmux_clean_minimal"}
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == HEAD
          private = Path(os.environ["RUNNER_TEMP"]) / "ci1107-state-private" / case
          public = Path(os.environ["RUNNER_TEMP"]) / "ci1107-state-public"
          private.mkdir(parents=True, exist_ok=True)
          public.mkdir(parents=True, exist_ok=True)
          selected = json.loads(subprocess.check_output(
              ["node", "tests/e2e/run.mjs", "--list", "--shard", "1/5"], text=True))
          assert len(selected) == 42 and selected[39] == "triage-ui.spec.mjs"
          expected = selected
          if case == "state_first":
              expected = selected[:20] + ["triage-ui.spec.mjs"]
          elif case == "state_last":
              expected = selected[20:40]
          if case in {"state_minimal", "tmux_clean_minimal"}:
              expected = ["side-panel.spec.mjs", "triage-ui.spec.mjs"]
          runner = Path("tests/e2e/run.mjs")
          original = runner.read_text()
          instrumentation = r'''
          import {execFileSync as __exec} from 'node:child_process'
          import {createHash as __hash} from 'node:crypto'
          import {mkdtempSync as __mktemp,rmSync as __remove} from 'node:fs'
          const __case = process.env.DIAG_CASE
          const __states = []
          const __envHash = () => Object.fromEntries(['PATH','SHELL','TMUX_TMPDIR'].map(key=>[
            key,__hash('sha256').update(process.env[key] || '').digest('hex')]))
          function __state(file,when) {
            const row={file,when,liveApps:liveAppPids(),environment:__envHash()}
            try {
              const shell=__exec('tmux',['-L','clave','show-option','-gv','default-shell'],{encoding:'utf8',stdio:['ignore','pipe','ignore'],timeout:3000}).trim()
              row.tmux={shellName:path.basename(shell),shellExists:existsSync(shell),shellFixture:shell.startsWith(fixtureRoot()+'/')?shell.slice(fixtureRoot().length+1):null}
              const sessions=__exec('tmux',['-L','clave','list-sessions','-F','#{session_path}'],{encoding:'utf8',stdio:['ignore','pipe','ignore'],timeout:3000}).trim().split('\n')
              row.tmux.sessions=sessions.length
              row.tmux.owned=sessions.filter(cwd=>cwd.startsWith(fixtureRoot()+'/') || cwd.startsWith('/private'+fixtureRoot()+'/')).length
            } catch {row.tmux=null}
            __states.push(row)
            writeFileSync(process.env.CI1107_STATE_FILE,JSON.stringify(__states))
          }
          let __socket
          function __before(file) {
            if(__case==='tmux_per_spec') {
              __socket=__mktemp('/tmp/ci1107-state-tmux-')
              process.env.TMUX_TMPDIR=__socket
            }
            __state(file,'before')
          }
          function __after(file) {
            __state(file,'after')
            if(__case==='cleanup') {killLeakedApps();killLeakedServers();killLeakedE2eTmux();__state(file,'cleaned')}
            if(__case==='tmux_clean_minimal') {killLeakedE2eTmux();__state(file,'cleaned')}
            if(__socket) {
              try {__exec('tmux',['-L','clave','kill-server'],{stdio:'ignore',timeout:3000})} catch {}
              __remove(__socket,{recursive:true})
              delete process.env.TMUX_TMPDIR
              __socket=null
            }
          }
          '''
          assert original.count("const specs = selectShard(selected, options.shard)") == 1
          patched = original.replace("const specs = selectShard(selected, options.shard)",
                                    "const specs = " + json.dumps(expected))
          patched = patched.split("\n", 1)[0] + "\n" + instrumentation + patched.split("\n", 1)[1]
          assert patched.count("  const specStarted = Date.now()") == 1
          patched = patched.replace("  const specStarted = Date.now()", "  __before(file)\n  const specStarted = Date.now()")
          assert patched.count("  // A spec that asserts nothing") == 1
          patched = patched.replace("  // A spec that asserts nothing", "  __after(file)\n  // A spec that asserts nothing")
          result = {"case": case, "sourceHead": HEAD,
                    "kind": "Instrumented diagnostic, not unmodified head CI or performance proof",
                    "runnerPatchSha256": hashlib.sha256(patched.encode()).hexdigest(),
                    "expected": expected, "reportsComplete": False}
          try:
              runner.write_text(patched)
              env = dict(os.environ, CLAVE_E2E_NS="clave-e2e-ci-"+str(uuid.uuid4()),
                         CI1107_STATE_FILE=str(private / "states.json"))
              env.pop("GITHUB_OUTPUT", None)
              target = private / "report.json"
              with (private / "runner.log").open("w") as log:
                  process = subprocess.run(["node", str(runner), "--shard", "1/5", "--report", str(target)],
                                           env=env, stdout=log, stderr=subprocess.STDOUT, timeout=1800)
              report = json.loads(target.read_text())
              assert process.returncode in (0, 1) and report["completed"] is True
              assert process.returncode == report["exitCode"] and report["selected"] == expected
              validate = """import {mergeReports} from './tests/e2e/merge-reports.mjs';
          import {readFileSync} from 'node:fs';const d=JSON.parse(readFileSync(0,'utf8'));
          mergeReports([{...d.report,shard:{index:1,total:1}}],d.expected,1);"""
              subprocess.run(["node", "--input-type=module", "-e", validate],
                             input=json.dumps({"report": report, "expected": expected}), text=True, check=True)
              result["counts"] = {name: len(checks) for name, checks in report["results"].items()}
              result["failedNames"] = {name: [c["name"] for c in checks if not c["ok"]]
                                       for name, checks in report["results"].items() if any(not c["ok"] for c in checks)}
              result["reportsComplete"] = True
          except BaseException as error:
              result["driverErrorType"] = type(error).__name__
              raise
          finally:
              runner.write_text(original)
              result["sourceRestored"] = subprocess.run(["git", "diff", "--exit-code"],
                                                        stdout=subprocess.DEVNULL).returncode == 0
              states = private / "states.json"
              result["states"] = json.loads(states.read_text()) if states.exists() else []
              (public / (case + ".json")).write_text(json.dumps(result, indent=2)+"\n")
              print(json.dumps({k: result.get(k) for k in ("case", "reportsComplete", "sourceRestored", "driverErrorType")}))
          PYDIAG
      - name: Upload allowlisted diagnostic summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ matrix.case }}
          path: ${{ runner.temp }}/ci1107-state-public/*.json
          if-no-files-found: error
